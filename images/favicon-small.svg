<!-- Small-size variant of the Kerrigan NameSpace mark, used for the 16px and 32px favicons.
     Same tile and icon as favicon.svg, but the DNS-node overlay is dropped and the icon
     scaled up to fill the square: at 16px the overlay is only ~5px across, which renders
     as noise and crowds the icon rather than reading as three linked nodes. -->
