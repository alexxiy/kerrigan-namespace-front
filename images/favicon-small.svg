  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ede3fd" />
    </linearGradient>
  </defs>
  <rect width="500" height="500" rx="110" ry="110" fill="url(#grad)" />

