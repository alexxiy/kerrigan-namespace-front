<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Page background: the app's own black, as kerrigan.network's (#000000), lit by the
         logo's purple from the top left and its green from the bottom right. -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Badge tile, matching the app's header mark: a dark tile ringed in Kerrigan's purple.
         favicon.svg keeps its white tile, which a browser tab strip needs. -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d0d38" />
      <stop offset="100%" stop-color="#0b0416" />
    </linearGradient>

    <radialGradient id="purpleGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#8341ed" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#8341ed" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="greenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#43de78" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#43de78" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8341ed" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#140828" stop-opacity="0.55" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <circle cx="220" cy="50" r="560" fill="url(#purpleGlow)" />
  <circle cx="1020" cy="600" r="420" fill="url(#greenGlow)" />

  <!-- Subtle grid, in the light purple of the app's dot lattice -->
  <g opacity="0.07" stroke="#bd81fb" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <rect x="80" y="60" width="1040" height="510" rx="32" fill="url(#cardGrad)" stroke="#8341ed" stroke-opacity="0.45" stroke-width="1.5" />

  <!-- Brand mark: the Kerrigan icon with the DNS-node overlay, identical geometry to
       favicon.svg so the icon set and the social card cannot drift apart.
       favicon.svg is a 500x500 canvas; 0.24 scales it to a 120px badge. -->
  <g transform="translate(140, 135) scale(0.24)">
    <rect width="500" height="500" rx="110" ry="110" fill="url(#brandGrad)" stroke="#8341ed" stroke-opacity="0.6" stroke-width="6" />
    <g transform="translate(52.17 45.41) scale(5.7054)">
      <path fill="#8341ed" d="M59.17,36.38h-12.04l13.39-13.39c.37-.37.57-.86.58-1.38l.04-8.54c0-.52-.21-1.03-.58-1.4l-3.51-3.51c-.77-.77-2.02-.77-2.78,0l-22.06,22.06L10.13,8.16c-.77-.77-2.02-.77-2.78,0l-3.47,3.47c-.37.37-.58.87-.58,1.39v8.59c0,.53.2,1.02.58,1.39l13.38,13.38H5.27c-1.09,0-1.97.88-1.97,1.97v4.9c0,.53.2,1.02.58,1.39l6.07,6.07c.37.37.87.58,1.39.58h8.09v1.1c0,.53.2,1.02.58,1.39l3.47,3.47c.77.77,2.02.77,2.78,0l5.93-5.93,5.93,5.93c.77.77,2.02.77,2.78,0l3.51-3.51c.37-.37.58-.88.58-1.4v-1.04s8.09,0,8.09,0c.53,0,1.02-.2,1.39-.58l6.07-6.07c.37-.37.58-.87.58-1.39v-4.9c0-1.09-.88-1.97-1.97-1.97Z" />
      <path fill="#43de78" d="M24.13,15.45l7.98,8.02,8.01-8.01c.94-.94.28-2.56-1.06-2.56h-13.87c-1.33,0-2,1.61-1.06,2.55Z" />
    </g>
    <g transform="translate(296.4, 296.4) scale(0.84)">
      <circle cx="90" cy="90" r="100" fill="#43de78" stroke="#ffffff" stroke-width="16" />
      <circle cx="50" cy="90" r="20" fill="#1a0a2e" />
      <circle cx="130" cy="60" r="20" fill="#1a0a2e" />
      <circle cx="110" cy="130" r="20" fill="#1a0a2e" />
      <line x1="50" y1="90" x2="130" y2="60" stroke="#1a0a2e" stroke-width="12" />
      <line x1="50" y1="90" x2="110" y2="130" stroke="#1a0a2e" stroke-width="12" />
      <line x1="130" y1="60" x2="110" y2="130" stroke="#1a0a2e" stroke-width="12" />
    </g>
  </g>

  <text x="290" y="203" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="64" fill="#ffffff" letter-spacing="-1">Kerrigan NameSpace</text>
  <text x="292" y="255" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="28" fill="#cba8fb">Decentralized Domain Name Service for Kerrigan</text>

  <text x="140" y="360" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="24" fill="#d1d5db">
    Register readable domain names for Kerrigan Sapling shielded addresses.
  </text>
  <text x="140" y="400" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="24" fill="#9ca3af">
    Fast, private, secure name resolution and domain marketplace on Kerrigan.
  </text>

  <!-- All five registrable zones, matching kns-core's ALLOWED_ZONES. .kerrigan and .krgn take
       the logo's purple and green, as their badges do in the app. -->
  <g transform="translate(140, 460)">
    <rect x="0" y="0" width="154" height="46" rx="23" fill="#8341ed" fill-opacity="0.2" stroke="#a05ff4" stroke-opacity="0.55" stroke-width="1.5" />
    <text x="77" y="31" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="20" fill="#cba8fb" text-anchor="middle">.kerrigan</text>

    <rect x="170" y="0" width="112" height="46" rx="23" fill="#43de78" fill-opacity="0.15" stroke="#43de78" stroke-opacity="0.45" stroke-width="1.5" />
    <text x="226" y="31" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="20" fill="#b4f2c9" text-anchor="middle">.krgn</text>

    <rect x="298" y="0" width="150" height="46" rx="23" fill="#a05ff4" fill-opacity="0.15" stroke="#a05ff4" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="373" y="31" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="20" fill="#cba8fb" text-anchor="middle">.private</text>

    <rect x="464" y="0" width="146" height="46" rx="23" fill="#a05ff4" fill-opacity="0.15" stroke="#a05ff4" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="537" y="31" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="20" fill="#cba8fb" text-anchor="middle">.secure</text>

    <rect x="626" y="0" width="118" height="46" rx="23" fill="#a05ff4" fill-opacity="0.15" stroke="#a05ff4" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="685" y="31" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="20" fill="#cba8fb" text-anchor="middle">.safe</text>
  </g>

  <!-- Below the chip row: five zones reach x 884, where the domain would otherwise sit. -->
  <text x="1060" y="546" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="24" fill="#ffffff" text-anchor="end" opacity="0.9">kerrigan-name.space</text>
</svg>
